<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Life"><meta name="format-detection" content="telephone=no"><title>My Life ♡</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#fff8fa;--card:#fff;--ink:#332d31;--muted:#8e8188;--accent:#d98fa7;--line:#f0e2e7}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:760px;margin:auto;padding:18px 16px 92px}.hero{height:220px;border-radius:26px;background:linear-gradient(135deg,#f7dce5,#f5eef1);background-size:cover;background-position:center;position:relative;overflow:hidden;box-shadow:0 8px 28px #8d53621c}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,#0004)}.heroText{position:absolute;z-index:2;left:20px;bottom:18px;color:#fff}.hero h1{margin:0;font-size:30px}.hero button{position:absolute;z-index:3;right:14px;top:14px}.btn{border:0;border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink);box-shadow:0 3px 12px #0001}.accent{background:var(--accent);color:white}.section{margin-top:20px}.section h2{font-size:18px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 5px 18px #7c43550b}.tile{text-align:center;font-size:14px}.tile b{font-size:25px;display:block;margin-bottom:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:25px;font-weight:750;margin-top:4px}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;font:inherit}textarea{min-height:90px}.list{display:grid;gap:9px}.item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.thumb{width:58px;height:58px;border-radius:12px;object-fit:cover;background:#f3e8ec}.grow{flex:1}.money{font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffc;border-top:1px solid var(--line);backdrop-filter:blur(15px);display:flex;justify-content:center;z-index:10}.nav div{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px max(8px,env(safe-area-inset-bottom))}.nav button{border:0;background:none;padding:8px;color:var(--muted)}.nav button.active{color:var(--accent);font-weight:700}.page{display:none}.page.active{display:block}.fab{font-size:25px!important;color:white!important;background:var(--accent)!important;border-radius:50%!important;width:48px;margin:auto}.modal{position:fixed;inset:0;background:#0006;z-index:20;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:var(--bg);width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:25px 25px 0 0;padding:18px}.sheet h3{margin-top:0}.actions{display:flex;gap:8px;margin-top:12px}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:480px){.grid{grid-template-columns:repeat(3,1fr)}.hero{height:190px}}
</style></head><body><main>
<section id="home" class="page active"><div id="hero" class="hero"><button class="btn" onclick="coverInput.click()">更換照片</button><div class="heroText"><div class="muted" style="color:#fff">我的私人生活手帳</div><h1>My Life ♡</h1></div></div><input id="coverInput" type="file" accept="image/*" capture="environment" hidden>
<div class="section stats"><div class="card"><span class="muted">今日待辦</span><div id="todoStat" class="big">0 件</div></div><div class="card"><span class="muted">本月消費</span><div id="expenseStat" class="big">$0</div></div></div>
<div class="section"><h2>我的生活</h2><div id="categories" class="grid"></div></div><div class="section"><h2>最近紀錄</h2><div id="recent" class="list"></div></div></section>
<section id="records" class="page"><h1>生活紀錄</h1><div class="row"><input id="search" placeholder="搜尋美甲、髮型、店家、備註…"><button class="btn accent" onclick="openRecord()">＋新增</button></div><div id="recordList" class="list section"></div></section>
<section id="expenses" class="page"><h1>我的消費</h1><div class="card"><span class="muted">本月累計</span><div id="expenseTotal" class="big">$0</div></div><button class="btn accent section" onclick="openExpense()">＋新增消費</button><div id="expenseList" class="list section"></div></section>
<section id="todos" class="page"><h1>待辦事項</h1><div class="row"><input id="todoText" placeholder="例如：預約美甲"><input id="todoDate" type="date"><button class="btn accent" onclick="addTodo()">新增</button></div><div id="todoList" class="list section"></div></section>
<section id="settings" class="page"><h1>設定</h1><div class="card"><h2>資料備份</h2><p class="muted">資料目前儲存在這台裝置的瀏覽器。建議定期下載備份。</p><div class="actions"><button class="btn" onclick="backup()">下載備份</button><button class="btn" onclick="restoreInput.click()">還原備份</button><input id="restoreInput" type="file" accept="application/json" hidden></div></div><div class="card section"><h2>自訂分類</h2><div class="row"><input id="newCat" placeholder="例如：香水"><button class="btn accent" onclick="addCategory()">新增</button></div></div></section>
</main>
<nav class="nav"><div><button onclick="showPage('home',this)" class="active">⌂<br>首頁</button><button onclick="showPage('records',this)">♡<br>生活</button><button class="fab" onclick="openRecord()">＋</button><button onclick="showPage('expenses',this)">$<br>消費</button><button onclick="showPage('todos',this)">✓<br>待辦</button></div></nav>
<div id="recordModal" class="modal"><div class="sheet"><h3>新增生活紀錄</h3><input id="rTitle" placeholder="標題，例如：奶茶貓眼美甲"><div class="row section"><select id="rCat"></select><input id="rDate" type="date"></div><input id="rPlace" class="section" placeholder="店家 / 地點（選填）"><input id="rPrice" class="section" type="number" placeholder="價格（選填，可同步記入消費）"><textarea id="rNote" class="section" placeholder="備註、心得、下次想怎麼做…"></textarea><input id="rPhoto" class="section" type="file" accept="image/*" capture="environment"><div class="actions"><button class="btn" onclick="closeModal('recordModal')">取消</button><button class="btn accent" onclick="saveRecord()">儲存</button></div></div></div>
<div id="expenseModal" class="modal"><div class="sheet"><h3>新增消費</h3><input id="eTitle" placeholder="買了什麼 / 做了什麼"><div class="row section"><input id="eAmount" type="number" placeholder="金額"><input id="eDate" type="date"></div><select id="eCat" class="section"><option>美容</option><option>餐飲</option><option>購物</option><option>交通</option><option>娛樂</option><option>生活</option><option>其他</option></select><textarea id="eNote" class="section" placeholder="備註（選填）"></textarea><div class="actions"><button class="btn" onclick="closeModal('expenseModal')">取消</button><button class="btn accent" onclick="saveExpense()">儲存</button></div></div></div>
<script>
const K='mylife-v1';let data=JSON.parse(localStorage.getItem(K)||'null')||{categories:['💅 美甲','💇‍♀️ 髮型','👗 穿搭','🍴 美食','✈️ 旅遊','🛍️ 購物','❤️ 收藏'],records:[],expenses:[],todos:[],cover:''};const today=()=>new Date().toISOString().slice(0,10);function persist(){localStorage.setItem(K,JSON.stringify(data));render()}function money(n){return '$'+Number(n||0).toLocaleString('zh-TW')}function showPage(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function render(){hero.style.backgroundImage=data.cover?`url(${data.cover})`:'';categories.innerHTML=data.categories.map(c=>`<div class="tile" onclick="filterCat('${c.replaceAll("'","\\'")}')"><b>${c.split(' ')[0]}</b>${c.substring(c.indexOf(' ')+1)}</div>`).join('');rCat.innerHTML=data.categories.map(c=>`<option>${c}</option>`).join('');let now=new Date(),m=now.toISOString().slice(0,7),sum=data.expenses.filter(e=>e.date.startsWith(m)).reduce((a,e)=>a+Number(e.amount),0);expenseStat.textContent=expenseTotal.textContent=money(sum);todoStat.textContent=data.todos.filter(t=>!t.done&&(!t.date||t.date===today())).length+' 件';let rec=[...data.records].sort((a,b)=>b.date.localeCompare(a.date));recent.innerHTML=rec.slice(0,4).map(recordHTML).join('')||'<div class="empty">還沒有紀錄，按 ＋ 建立第一筆 ♡</div>';renderRecords();expenseList.innerHTML=[...data.expenses].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="item"><div class="grow"><b>${e.title}</b><div class="muted">${e.date} · ${e.cat}</div></div><div class="money">${money(e.amount)}</div><button class="btn" onclick="del('expenses','${e.id}')">×</button></div>`).join('')||'<div class="empty">還沒有消費紀錄</div>';todoList.innerHTML=[...data.todos].sort((a,b)=>Number(a.done)-Number(b.done)).map(t=>`<div class="item"><input style="width:24px" type="checkbox" ${t.done?'checked':''} onchange="toggleTodo('${t.id}')"><div class="grow" style="${t.done?'text-decoration:line-through;opacity:.5':''}"><b>${t.text}</b><div class="muted">${t.date||'沒有日期'}</div></div><button class="btn" onclick="del('todos','${t.id}')">×</button></div>`).join('')||'<div class="empty">今天沒有待辦事項 ♡</div>'}function recordHTML(r){return `<div class="item">${r.photo?`<img class="thumb" src="${r.photo}">`:'<div class="thumb"></div>'}<div class="grow"><b>${r.title}</b><div class="muted">${r.date} · ${r.cat}${r.place?' · '+r.place:''}</div>${r.note?`<div>${r.note}</div>`:''}</div><button class="btn" onclick="del('records','${r.id}')">×</button></div>`}function renderRecords(){let q=(search?.value||'').toLowerCase();let a=[...data.records].filter(r=>JSON.stringify(r).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));recordList.innerHTML=a.map(recordHTML).join('')||'<div class="empty">找不到紀錄</div>'}search.addEventListener('input',renderRecords);function filterCat(c){showPage('records',document.querySelectorAll('.nav button')[1]);search.value=c;renderRecords()}function openRecord(){rDate.value=today();recordModal.classList.add('open')}function openExpense(){eDate.value=today();expenseModal.classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}async function fileData(f){if(!f)return'';return await new Promise(res=>{let x=new FileReader();x.onload=()=>res(x.result);x.readAsDataURL(f)})}async function saveRecord(){if(!rTitle.value.trim())return alert('請輸入標題');let photo=await fileData(rPhoto.files[0]);let r={id:crypto.randomUUID(),title:rTitle.value.trim(),cat:rCat.value,date:rDate.value||today(),place:rPlace.value.trim(),price:Number(rPrice.value||0),note:rNote.value.trim(),photo};data.records.push(r);if(r.price)data.expenses.push({id:crypto.randomUUID(),title:r.title,amount:r.price,date:r.date,cat:'美容',note:'由生活紀錄同步'});['rTitle','rPlace','rPrice','rNote'].forEach(id=>document.getElementById(id).value='');rPhoto.value='';closeModal('recordModal');persist()}function saveExpense(){if(!eTitle.value.trim()||!eAmount.value)return alert('請輸入項目與金額');data.expenses.push({id:crypto.randomUUID(),title:eTitle.value.trim(),amount:Number(eAmount.value),date:eDate.value||today(),cat:eCat.value,note:eNote.value.trim()});eTitle.value=eAmount.value=eNote.value='';closeModal('expenseModal');persist()}function addTodo(){if(!todoText.value.trim())return;data.todos.push({id:crypto.randomUUID(),text:todoText.value.trim(),date:todoDate.value,done:false});todoText.value='';todoDate.value='';persist()}function toggleTodo(id){let t=data.todos.find(x=>x.id===id);t.done=!t.done;persist()}function del(type,id){if(confirm('確定要刪除嗎？')){data[type]=data[type].filter(x=>x.id!==id);persist()}}function addCategory(){let v=newCat.value.trim();if(v){data.categories.push('♡ '+v);newCat.value='';persist()}}coverInput.onchange=async()=>{data.cover=await fileData(coverInput.files[0]);persist()};function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='my-life-backup-'+today()+'.json';a.click()}restoreInput.onchange=()=>{let f=restoreInput.files[0],r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);persist();alert('還原完成')}catch{alert('備份檔格式不正確')}};r.readAsText(f)};render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
