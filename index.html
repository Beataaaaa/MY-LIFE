<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171417"><link rel="manifest" href="./manifest.json"><title>My Life ♡</title>
<style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}body{margin:0;background:#151216;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(#100d10aa,#100d10e8),linear-gradient(135deg,#71545f,#171417);background-size:cover;background-position:center;transition:.35s}.app{max-width:520px;margin:auto;padding:max(28px,calc(18px + env(safe-area-inset-top))) 16px calc(110px + env(safe-area-inset-bottom))}.head{display:flex;justify-content:space-between;align-items:flex-start}.brand{font:italic 45px/1.05 Georgia,serif}.sub{font-size:12px;letter-spacing:3px;color:#d9cdd1;margin-top:8px}.gear{border:1px solid #ffffff40;background:#211b20cc;color:#fff;border-radius:50%;width:42px;height:42px;font-size:19px}
.stage{height:410px;touch-action:pan-y;overscroll-behavior-x:contain;position:relative;perspective:1100px;-webkit-perspective:1100px;position:relative;perspective:1100px;margin-top:20px;overflow:hidden}.card{touch-action:none;user-select:none;-webkit-user-select:none;position:absolute;left:50%;top:10px;width:250px;height:365px;margin-left:-125px;border-radius:26px;overflow:hidden;border:1px solid #ffffff70;box-shadow:0 22px 48px #000b;background:linear-gradient(145deg,#876b75,#30262c);transition:transform .4s,opacity .4s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}.card img{width:100%;height:100%;object-fit:cover}.card .fallback{height:100%;display:grid;place-items:center;font-size:76px}.shade{position:absolute;inset:0;background:linear-gradient(transparent 40%,#090709e8 88%)}.info{position:absolute;left:18px;right:18px;bottom:18px}.info b{font:26px Georgia,serif}.info p{font-size:13px;color:#f1dce3;margin:6px 0 12px}.photoBtn{border:1px solid #ffffff66;background:#171217b8;color:#fff;border-radius:18px;padding:8px 11px}.a{transform:translate3d(0,0,70px) scale(1.015);z-index:9}.l{transform:translate3d(-58%,8px,-45px) rotateY(29deg) scale(.80);opacity:.72;z-index:6}.r{transform:translate3d(58%,8px,-45px) rotateY(-29deg) scale(.80);opacity:.72;z-index:6}.farL{transform:translate3d(-92%,16px,-95px) rotateY(36deg) scale(.65);opacity:.34;z-index:3}.farR{transform:translate3d(92%,16px,-95px) rotateY(-36deg) scale(.65);opacity:.34;z-index:3}.off{opacity:0;transform:scale(.5);pointer-events:none}.dots{text-align:center;margin-top:-8px}.dot{display:inline-block;width:22px;height:5px;border-radius:8px;background:#ffffff36;margin:3px}.dot.on{background:#f2c5d0}
.glass{background:#211c20b8;border:1px solid #ffffff35;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px}.hello{margin-top:13px;padding:16px 18px}.hello b{font:21px Georgia,serif}.muted{font-size:13px;color:#d9cfd2}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.quick button,.action{border:1px solid #ffffff35;background:#211c20c9;color:#fff;border-radius:16px;padding:13px 7px}.memoryAdd{width:100%;margin:0 0 14px;padding:13px;border:1px solid #ffffff45;border-radius:16px;background:linear-gradient(135deg,#f2c5d0,#dca9b8);color:#33232a;font-weight:800;font-size:16px}.panel{display:none;margin-top:12px;padding:17px;margin-bottom:88px}.panel.on{display:block}.item{padding:12px 0;border-bottom:1px solid #ffffff20}.item img{width:62px;height:62px;border-radius:11px;object-fit:cover;vertical-align:middle;margin-right:9px}
.fab{position:fixed;right:max(22px,calc((100vw - 520px)/2 + 22px));bottom:calc(92px + env(safe-area-inset-bottom));z-index:35;width:58px;height:58px;border:1px solid #ffffff55;border-radius:50%;background:#f2c5d0;color:#2b2024;font-size:34px;line-height:1;box-shadow:0 12px 30px #0008;display:none}.fab.on{display:block}.nav{position:fixed;z-index:30;left:50%;bottom:calc(9px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(490px,calc(100% - 22px));height:70px;display:flex;align-items:center;justify-content:space-around}.nav button{border:0;background:none;color:#ddd;font-size:11px}.nav span{display:block;font-size:20px;margin-bottom:4px}.nav .on{color:#f2c5d0}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:60}.modal.on{display:flex}.sheet{width:100%;max-width:520px;margin:auto;background:#211b20;padding:20px;border-radius:26px 26px 0 0;max-height:90vh;overflow:auto}input,select,textarea{width:100%;margin:6px 0;padding:12px;border-radius:13px;border:1px solid #ffffff35;background:#ffffff0d;color:#fff;font-size:16px}option{color:#111}textarea{min-height:80px}.primary{width:100%;padding:13px;border:0;border-radius:14px;background:#f2c5d0;color:#2b2024;font-weight:700;margin-top:8px}.close{float:right}.preview{display:flex;gap:8px;overflow:auto}.preview img{width:75px;height:75px;border-radius:11px;object-fit:cover}
@media(max-width:390px){.brand{font-size:39px}.stage{height:375px}.card{width:225px;height:335px;margin-left:-112.5px}}
</style></head><body><div id="bg" class="bg"></div><main class="app"><div class="head"><div><div class="brand">My Life ♡</div><div class="sub">把喜歡的日子・過成日常</div></div><button id="settingsBtn" class="gear">⚙︎</button></div><section id="stage" class="stage"></section><div id="dots" class="dots"></div><section class="glass hello"><b>Good Day, 美女 ♡</b><div id="summary" class="muted"></div></section><div class="quick"><button data-add="record">＋ 生活紀錄</button><button data-add="spend">＋ 消費</button><button data-add="todo">＋ 待辦</button></div><section id="panel" class="glass panel"><h2 id="panelTitle"></h2><button id="memoryAddBtn" class="memoryAdd" hidden>＋ 新增回憶 ♡</button><div id="list"></div></section><button id="fab" class="fab" aria-label="新增">＋</button></main>
<nav class="glass nav"><button data-nav="home" class="on"><span>⌂</span>首頁</button><button data-nav="BEAUTY"><span>♡</span>美甲</button><button data-nav="SPENDING"><span>▣</span>消費</button><button data-nav="DAILY"><span>☑</span>待辦</button><button data-nav="FAVORITE"><span>♥</span>收藏</button></nav>
<input id="coverPicker" type="file" accept="image/*" hidden>
<div id="addModal" class="modal"><div class="sheet"><button class="gear close" data-close="addModal">×</button><h2 id="addTitle">新增</h2><div id="recordFields"><select id="recordCat"><option>BEAUTY</option><option>MEMORY</option><option>FAVORITE</option><option>DAILY</option><option>HEALTH</option></select><input id="recordTitle" placeholder="標題，例如：奶茶色貓眼美甲"><input id="recordPlace" placeholder="店家 / 地點"><input id="recordPrice" type="number" inputmode="decimal" placeholder="金額（可不填）"><label class="muted">從手機相簿選照片（可多選）</label><input id="recordPhotos" type="file" accept="image/*" multiple><div id="photoPreview" class="preview"></div><div id="memoryFields" hidden><input id="memoryDate" type="date"><input id="memoryMood" placeholder="今天的心情，例如：開心 ♡"><textarea id="memoryStory" placeholder="寫下今天的故事、發生的事情、想記住的感受…"></textarea></div><textarea id="recordNote" placeholder="備註"></textarea></div><div id="spendFields" hidden><input id="spendTitle" placeholder="花了什麼"><input id="spendAmount" type="number" inputmode="decimal" placeholder="金額"><select id="spendCat"><option>美容</option><option>餐飲</option><option>購物</option><option>交通</option><option>其他</option></select></div><div id="todoFields" hidden><input id="todoText" placeholder="待辦事項"><input id="todoDate" type="date"></div><button id="saveBtn" class="primary">儲存 ♡</button></div></div>
<div id="settingsModal" class="modal"><div class="sheet"><button class="gear close" data-close="settingsModal">×</button><h2>設定</h2><p class="muted">卡片照片請直接按首頁卡片上的「📷 更換封面」。</p><button id="backupBtn" class="primary">匯出備份</button><label class="muted">還原備份</label><input id="restoreFile" type="file" accept=".json"><button id="restoreBtn" class="primary">還原備份</button></div></div>
<script>
(function(){'use strict';
const el=id=>document.getElementById(id), TYPES=[['MEMORY','生活紀錄・旅行・日常','✈️'],['FAVORITE','收藏・想買・想去','♡'],['BEAUTY','美甲・美容・變美紀錄','✦'],['SPENDING','消費紀錄・理財管理','$'],['DAILY','待辦・行程・習慣','✓'],['HEALTH','健康・飲食・運動','♡']];
let active=2,mode='record',coverTarget='BEAUTY',data={records:[],spends:[],todos:[],covers:{}};
try{const old=JSON.parse(localStorage.getItem('mylife-v5')||'null');if(old)data=Object.assign(data,old)}catch(e){}
const save=()=>{localStorage.setItem('mylife-v5',JSON.stringify(data));render();summary()};
const date=()=>new Date().toISOString().slice(0,10);
function compress(file,max=1400,q=.78){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',q))};im.onerror=reject;im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
function imageFor(type){const r=[...data.records].reverse().find(x=>x.cat===type&&x.photos&&x.photos[0]);return data.covers[type]||(r?r.photos[0]:'')}
function render(){const st=el('stage');st.innerHTML='';TYPES.forEach((c,i)=>{const d=i-active,cl=d===0?'a':d===-1?'l':d===1?'r':d===-2?'farL':d===2?'farR':'off',card=document.createElement('article'),im=imageFor(c[0]);card.className='card '+cl;card.dataset.index=i;card.innerHTML=(im?'<img src="'+im+'" alt="">':'<div class="fallback">'+c[2]+'</div>')+'<div class="shade"></div><div class="info"><b>'+c[0]+'</b><p>'+c[1]+'</p><button class="photoBtn" data-cover="'+c[0]+'">📷 更換封面</button></div>';st.appendChild(card)});el('dots').innerHTML=TYPES.map((_,i)=>'<i class="dot '+(i===active?'on':'')+'"></i>').join('');const bg=imageFor(TYPES[active][0]);el('bg').style.backgroundImage=bg?'linear-gradient(#100d10aa,#100d10e8),url("'+bg+'")':'linear-gradient(#100d10aa,#100d10e8),linear-gradient(135deg,#71545f,#171417)'}
el('stage').addEventListener('click',e=>{const cb=e.target.closest('[data-cover]');if(cb){e.stopPropagation();coverTarget=cb.dataset.cover;el('coverPicker').click();return}const card=e.target.closest('.card');if(!card)return;const i=Number(card.dataset.index);if(i!==active){active=i;render()}else openCategory(TYPES[i][0])});
let sx=0,lastX=0,startT=0,dragging=false;
el('stage').addEventListener('touchstart',e=>{sx=lastX=e.touches[0].clientX;startT=Date.now();dragging=true;document.querySelectorAll('.card').forEach(c=>{c.style.transition='none'})},{passive:true});
el('stage').addEventListener('touchmove',e=>{if(!dragging)return;lastX=e.touches[0].clientX;const dx=lastX-sx;if(Math.abs(dx)>6)e.preventDefault();const cur=el('stage').querySelector('.card.a');if(cur)cur.style.transform=`translate3d(${dx*.78}px,${Math.min(7,Math.abs(dx)*.025)}px,82px) rotateY(${-dx*.055}deg) scale(${1.015-Math.min(.035,Math.abs(dx)/2600)})`},{passive:false});
el('stage').addEventListener('touchend',e=>{if(!dragging)return;dragging=false;const dx=e.changedTouches[0].clientX-sx,dt=Math.max(1,Date.now()-startT),v=Math.abs(dx)/dt;document.querySelectorAll('.card').forEach(c=>c.style.transition='transform .34s cubic-bezier(.22,.8,.3,1),opacity .28s');if(Math.abs(dx)>24||v>.28){active=Math.max(0,Math.min(TYPES.length-1,active+(dx<0?1:-1)))}render()},{passive:true});
el('coverPicker').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;data.covers[coverTarget]=await compress(f,1600,.8);e.target.value='';save()});
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>openAdd(b.dataset.add)));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>el(b.dataset.close).classList.remove('on')));el('settingsBtn').onclick=()=>el('settingsModal').classList.add('on');el('memoryAddBtn').onclick=()=>{el('recordCat').value='MEMORY';openAdd('record');updateMemoryFields()};el('fab').onclick=()=>{const t=el('fab').dataset.type;if(t==='SPENDING')openAdd('spend');else if(t==='DAILY')openAdd('todo');else{el('recordCat').value=t||TYPES[active][0];openAdd('record');updateMemoryFields()}};
function updateMemoryFields(){const isMem=el('recordCat').value==='MEMORY';el('memoryFields').hidden=!isMem;el('recordNote').style.display=isMem?'none':'block'}el('recordCat').addEventListener('change',updateMemoryFields);function openAdd(m){mode=m;el('addTitle').textContent=m==='record'?'新增生活紀錄':m==='spend'?'新增消費':'新增待辦';el('recordFields').hidden=m!=='record';el('spendFields').hidden=m!=='spend';el('todoFields').hidden=m!=='todo';el('addModal').classList.add('on');if(m==='record')updateMemoryFields()}
el('recordPhotos').onchange=e=>{el('photoPreview').innerHTML='';[...e.target.files].forEach(f=>{const im=new Image();im.src=URL.createObjectURL(f);el('photoPreview').appendChild(im)})};
el('saveBtn').onclick=async()=>{if(mode==='record'){const t=el('recordTitle').value.trim();if(!t)return alert('請輸入標題');const ps=await Promise.all([...el('recordPhotos').files].map(f=>compress(f)));const rc=el('recordCat').value,isMem=rc==='MEMORY';data.records.push({id:Date.now(),cat:rc,title:t,place:el('recordPlace').value.trim(),price:Number(el('recordPrice').value||0),note:isMem?el('memoryStory').value.trim():el('recordNote').value.trim(),mood:isMem?el('memoryMood').value.trim():'',date:isMem?(el('memoryDate').value||date()):date(),photos:ps});['recordTitle','recordPlace','recordPrice','recordNote','memoryMood','memoryStory','memoryDate'].forEach(x=>el(x).value='');el('recordPhotos').value='';el('photoPreview').innerHTML=''}else if(mode==='spend'){const t=el('spendTitle').value.trim(),a=Number(el('spendAmount').value);if(!t||!a)return alert('請輸入消費內容與金額');data.spends.push({id:Date.now(),title:t,amount:a,cat:el('spendCat').value,date:date()});el('spendTitle').value=el('spendAmount').value=''}else{const t=el('todoText').value.trim();if(!t)return alert('請輸入待辦');data.todos.push({text:t,date:el('todoDate').value||date(),done:false});el('todoText').value=''}el('addModal').classList.remove('on');save();const t=el('fab').dataset.type;if(el('fab').classList.contains('on')){if(t==='SPENDING')showSpending();else if(t==='DAILY')showTodos();else showType(t)}};
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openCategory(t){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('on'));const nb=document.querySelector(`[data-nav="${t}"]`);if(nb)nb.classList.add('on');if(t==='SPENDING')showSpending();else if(t==='DAILY')showTodos();else showType(t)}
function showType(t){el('memoryAddBtn').hidden=t!=='MEMORY';el('fab').classList.add('on');el('fab').dataset.type=t;el('panel').classList.add('on');el('panelTitle').textContent=t;const a=data.records.filter(x=>x.cat===t).reverse();el('list').innerHTML=a.map(r=>'<div class="item">'+(r.photos&&r.photos[0]?'<img src="'+r.photos[0]+'">':'')+'<b>'+esc(r.title)+'</b><div class="muted">'+esc(r.date)+' '+esc(r.place)+(r.price?'・$'+r.price:'')+'</div><div>'+esc(r.note)+'</div></div>').join('')||'<p class="muted">還沒有紀錄 ♡</p>';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function showSpending(){el('memoryAddBtn').hidden=true;el('fab').classList.add('on');el('fab').dataset.type='SPENDING';el('panel').classList.add('on');el('panelTitle').textContent='消費紀錄';const total=data.spends.reduce((a,x)=>a+Number(x.amount),0);el('list').innerHTML='<h3>累計 $'+total.toLocaleString()+'</h3>'+data.spends.slice().reverse().map(x=>'<div class="item"><b>'+esc(x.title)+'</b>　$'+Number(x.amount).toLocaleString()+'<div class="muted">'+x.date+'・'+x.cat+'</div><button class="action" data-del-spend="'+(x.id||'')+'" style="margin-top:8px;padding:7px 10px">刪除</button></div>').join('')}
function showTodos(){el('memoryAddBtn').hidden=true;el('fab').classList.add('on');el('fab').dataset.type='DAILY';el('panel').classList.add('on');el('panelTitle').textContent='待辦事項';el('list').innerHTML=data.todos.map((x,i)=>'<div class="item"><span data-todo="'+i+'">'+(x.done?'☑':'☐')+' <b style="'+(x.done?'text-decoration:line-through;opacity:.5':'')+'">'+esc(x.text)+'</b></span><div class="muted">'+x.date+'</div><button class="action" data-del-todo="'+i+'" style="margin-top:8px;padding:7px 10px">刪除</button></div>').join('')||'<p class="muted">沒有待辦 ♡</p>'}
el('list').onclick=e=>{let x=e.target.closest('[data-todo]');if(x){const i=Number(x.dataset.todo);data.todos[i].done=!data.todos[i].done;save();showTodos();return}x=e.target.closest('[data-del-record]');if(x&&confirm('要刪除這筆紀錄嗎？')){data.records=data.records.filter(r=>String(r.id)!==x.dataset.delRecord);save();showType(el('fab').dataset.type);return}x=e.target.closest('[data-del-spend]');if(x&&confirm('要刪除這筆消費嗎？')){const id=x.dataset.delSpend;data.spends=id?data.spends.filter(r=>String(r.id)!==id):data.spends;save();showSpending();return}x=e.target.closest('[data-del-todo]');if(x&&confirm('要刪除這筆待辦嗎？')){data.todos.splice(Number(x.dataset.delTodo),1);save();showTodos()}};
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('on'));b.classList.add('on');const n=b.dataset.nav;if(n==='home'){el('panel').classList.remove('on');el('fab').classList.remove('on');scrollTo({top:0,behavior:'smooth'})}else openCategory(n)});
function summary(){const u=data.todos.filter(x=>!x.done).length,m=date().slice(0,7),s=data.spends.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.amount,0);el('summary').textContent='待辦 '+u+' 件・本月消費 $'+s.toLocaleString()}
el('backupBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='my-life-backup.json';a.click()};
el('restoreBtn').onclick=()=>{const f=el('restoreFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();alert('還原完成 ♡')}catch(e){alert('備份檔格式錯誤')}};r.readAsText(f)};
try{render();summary()}catch(err){console.error(err);const st=el('stage');st.innerHTML='';TYPES.forEach((c,i)=>{const card=document.createElement('article');card.className='card '+(i===2?'a':i===1?'l':i===3?'r':'off');card.dataset.index=i;card.innerHTML='<div class="fallback">'+c[2]+'</div><div class="shade"></div><div class="info"><b>'+c[0]+'</b><p>'+c[1]+'</p></div>';st.appendChild(card)})}
})();
</script></body></html>
