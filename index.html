<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171417"><link rel="manifest" href="manifest.json"><title>My Life ♡</title>
<style>
:root{--pink:#f3c8d2;--glass:rgba(28,25,29,.67);--line:#ffffff35;--muted:#d8cfd2}*{box-sizing:border-box}body{margin:0;background:#171417;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;min-height:100vh;overflow-x:hidden}.bg{position:fixed;inset:-25px;background:linear-gradient(#08070a66,#08070acc),var(--bg,linear-gradient(135deg,#624c55,#171417));background-size:cover;background-position:center;filter:blur(10px);transform:scale(1.08);z-index:-2;transition:.45s}.app{max-width:520px;margin:auto;padding:max(28px,calc(18px + env(safe-area-inset-top))) 17px calc(105px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between}.brand{font:italic clamp(38px,11vw,48px) Georgia,serif;line-height:1.12;padding-top:2px}.sub{letter-spacing:4px;color:var(--muted);font-size:12px}.circle{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#19161aaa;color:#fff;font-size:20px}.carousel{height:445px;position:relative;perspective:1100px;margin-top:18px;touch-action:pan-y}.card{position:absolute;left:50%;top:18px;width:270px;height:400px;margin-left:-135px;border-radius:27px;overflow:hidden;border:1px solid #ffffff66;box-shadow:0 24px 55px #000a;background:#302930;transition:.42s;transform-style:preserve-3d}.card img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(transparent 42%,#09080ad9 88%)}.ct{position:absolute;left:19px;right:19px;bottom:22px}.ct b{font:27px Georgia,serif}.ct p{margin:7px 0;color:#f2dce1;font-size:13px}.active{transform:translateZ(80px);z-index:10}.l1{transform:translateX(-59%) rotateY(23deg) scale(.82);z-index:8;opacity:.84}.l2{transform:translateX(-91%) rotateY(30deg) scale(.68);z-index:5;opacity:.48}.r1{transform:translateX(59%) rotateY(-23deg) scale(.82);z-index:8;opacity:.84}.r2{transform:translateX(91%) rotateY(-30deg) scale(.68);z-index:5;opacity:.48}.hide{transform:scale(.5);opacity:0;pointer-events:none}.dots{text-align:center;margin:-4px 0 12px}.dot{display:inline-block;width:25px;height:5px;border-radius:8px;background:#ffffff36;margin:4px}.dot.on{background:var(--pink)}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:23px}.today{padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.today strong{font:21px Georgia,serif}.muted{color:var(--muted);font-size:13px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}.quick button{padding:13px 4px;border-radius:17px;border:1px solid var(--line);background:var(--glass);color:#fff}.panel{display:none;margin-top:13px;padding:17px}.panel.on{display:block}.item{padding:12px 0;border-bottom:1px solid #ffffff20}.item img{width:65px;height:65px;object-fit:cover;border-radius:12px;vertical-align:middle;margin-right:9px}.nav{position:fixed;left:50%;bottom:calc(9px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(490px,calc(100% - 22px));height:72px;display:flex;justify-content:space-around;align-items:center;z-index:30}.nav button{border:0;background:none;color:#ddd;font-size:11px}.nav span{display:block;font-size:21px;margin-bottom:4px}.nav .on{color:var(--pink)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:50}.modal.on{display:flex}.sheet{width:100%;max-width:520px;margin:auto;background:#211c21;padding:22px;border-radius:28px 28px 0 0;max-height:90vh;overflow:auto}input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:14px;border:1px solid var(--line);background:#ffffff0c;color:#fff;font-size:16px}option{color:#111}textarea{min-height:80px}.primary{width:100%;padding:13px;border:0;border-radius:15px;background:var(--pink);color:#2b2024;font-weight:700;margin-top:8px}.photos{display:flex;gap:8px;overflow:auto}.photos img{width:76px;height:76px;object-fit:cover;border-radius:12px}
@media(max-width:390px){.carousel{height:405px}.card{width:238px;height:360px;margin-left:-119px}.today{font-size:14px}.today strong{font-size:19px}.sub{letter-spacing:3px}}
</style></head><body><div class="bg" id="bg"></div><main class="app"><div class="top"><div><div class="brand">My Life ♡</div><div class="sub">把喜歡的日子・過成日常</div></div><button class="circle" onclick="openSettings()">⚙︎</button></div><div class="carousel" id="carousel"></div><div class="dots" id="dots"></div><section class="glass today"><div><strong>Good Day, 美女 ♡</strong><div class="muted" id="summary"></div></div><div id="date"></div></section><div class="quick"><button onclick="openAdd('record')">＋ 生活紀錄</button><button onclick="openAdd('spend')">＋ 消費</button><button onclick="openAdd('todo')">＋ 待辦</button></div><section class="glass panel" id="panel"><h2 id="panelTitle"></h2><div id="list"></div></section></main>
<nav class="glass nav"><button class="on" onclick="home(this)"><span>⌂</span>首頁</button><button onclick="showType('BEAUTY',this)"><span>♡</span>美甲</button><button onclick="showSpending(this)"><span>▣</span>消費</button><button onclick="showTodos(this)"><span>☑</span>待辦</button><button onclick="showType('FAVORITE',this)"><span>♥</span>收藏</button></nav>
<div class="modal" id="addModal"><div class="sheet"><button class="circle" style="float:right" onclick="closeM('addModal')">×</button><h2 id="addTitle">新增</h2><div id="rf"><select id="cat"><option>BEAUTY</option><option>MEMORY</option><option>FAVORITE</option><option>DAILY</option><option>HEALTH</option></select><input id="title" placeholder="標題，例如：奶茶色貓眼美甲"><input id="place" placeholder="店家 / 地點"><input id="price" type="number" inputmode="decimal" placeholder="金額（可不填）"><label class="muted">從手機相簿選照片（可多選）</label><input id="photos" type="file" accept="image/*" multiple><div class="photos" id="preview"></div><textarea id="note" placeholder="備註"></textarea></div><div id="sf" style="display:none"><input id="spendTitle" placeholder="花了什麼"><input id="amount" type="number" inputmode="decimal" placeholder="金額"><select id="spendCat"><option>美容</option><option>餐飲</option><option>購物</option><option>交通</option><option>其他</option></select></div><div id="tf" style="display:none"><input id="todoText" placeholder="待辦事項"><input id="todoDate" type="date"></div><button class="primary" onclick="saveAdd()">儲存 ♡</button></div></div>
<div class="modal" id="settings"><div class="sheet"><button class="circle" style="float:right" onclick="closeM('settings')">×</button><h2>我的風格</h2><label class="muted">首頁背景照片</label><input id="homeCover" type="file" accept="image/*"><label class="muted">目前卡片封面照片</label><input id="cardCover" type="file" accept="image/*"><button class="primary" onclick="backup()">匯出備份</button><label class="muted">還原備份</label><input id="restoreFile" type="file" accept=".json"><button class="primary" onclick="restore()">還原備份</button></div></div>
<script>
const cards=[['MEMORY','生活紀錄・旅行・日常','✈️'],['FAVORITE','收藏・想買・想去','♡'],['BEAUTY','美甲・美容・變美紀錄','✦'],['SPENDING','消費紀錄・理財管理','$'],['DAILY','待辦・行程・習慣','✓'],['HEALTH','健康・飲食・運動','♡']];let data=JSON.parse(localStorage.getItem('mylife-v4')||'{"records":[],"spends":[],"todos":[],"covers":{},"homeCover":""}'),active=2,mode='record';const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);function persist(){localStorage.setItem('mylife-v4',JSON.stringify(data));render();sum()}
async function imgData(f,max=1400,q=.78){if(!f)return'';return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function imageFor(t){let r=[...data.records].reverse().find(x=>x.cat===t&&x.photos?.[0]);return data.covers[t]||r?.photos?.[0]||''}function render(){$('carousel').innerHTML='';cards.forEach((c,i)=>{let d=i-active,cl=d==0?'active':d==-1?'l1':d==-2?'l2':d==1?'r1':d==2?'r2':'hide',im=imageFor(c[0]),e=document.createElement('article');e.className='card '+cl;e.innerHTML=im?`<img src="${im}">`:`<div style="height:100%;display:grid;place-items:center;font-size:80px;background:linear-gradient(135deg,#80656e,#292329)">${c[2]}</div>`;e.innerHTML+=`<div class="shade"></div><div class="ct"><b>${c[0]}</b><p>${c[1]}</p></div>`;e.onclick=()=>{if(i==active)openCat(c[0]);else{active=i;render()}};$('carousel').appendChild(e)});$('dots').innerHTML=cards.map((_,i)=>`<i class="dot ${i==active?'on':''}"></i>`).join('');let im=imageFor(cards[active][0])||data.homeCover;$('bg').style.setProperty('--bg',im?`url("${im}")`:'linear-gradient(135deg,#624c55,#171417)')}
let sx=0;$('carousel').ontouchstart=e=>sx=e.touches[0].clientX;$('carousel').ontouchend=e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>35){active=Math.max(0,Math.min(cards.length-1,active+(d<0?1:-1)));render()}}
function openCat(t){t==='SPENDING'?showSpending():t==='DAILY'?showTodos():showType(t)}function showType(t,b){nav(b);$('panel').classList.add('on');$('panelTitle').textContent=t;let a=data.records.filter(x=>x.cat===t).reverse();$('list').innerHTML=a.map(r=>`<div class="item">${r.photos?.[0]?`<img src="${r.photos[0]}">`:''}<b>${esc(r.title)}</b><div class="muted">${r.date||''} ${esc(r.place||'')}${r.price?'・$'+r.price:''}</div><div>${esc(r.note||'')}</div></div>`).join('')||'<p class="muted">還沒有紀錄 ♡</p>'}function showSpending(b){nav(b);$('panel').classList.add('on');$('panelTitle').textContent='消費紀錄';let total=data.spends.reduce((a,x)=>a+Number(x.amount),0);$('list').innerHTML=`<h3>累計 $${total.toLocaleString()}</h3>`+data.spends.slice().reverse().map(x=>`<div class="item"><b>${esc(x.title)}</b>　$${Number(x.amount).toLocaleString()}<div class="muted">${x.date}・${x.cat}</div></div>`).join('')}function showTodos(b){nav(b);$('panel').classList.add('on');$('panelTitle').textContent='待辦事項';$('list').innerHTML=data.todos.map((x,i)=>`<div class="item" onclick="toggle(${i})">${x.done?'☑':'☐'} <b style="${x.done?'text-decoration:line-through;opacity:.5':''}">${esc(x.text)}</b><div class="muted">${x.date}</div></div>`).join('')||'<p class="muted">沒有待辦 ♡</p>'}function toggle(i){data.todos[i].done=!data.todos[i].done;persist();showTodos()}function home(b){nav(b);$('panel').classList.remove('on');scrollTo({top:0,behavior:'smooth'})}function nav(b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on')}
function openAdd(m){mode=m;$('addModal').classList.add('on');$('rf').style.display=m==='record'?'block':'none';$('sf').style.display=m==='spend'?'block':'none';$('tf').style.display=m==='todo'?'block':'none';$('addTitle').textContent=m==='record'?'新增生活紀錄':m==='spend'?'新增消費':'新增待辦'}$('photos').onchange=()=>{$('preview').innerHTML='';[...$('photos').files].forEach(f=>{let i=new Image();i.src=URL.createObjectURL(f);$('preview').appendChild(i)})}
async function saveAdd(){if(mode==='record'){if(!$('title').value.trim())return alert('請輸入標題');let ps=await Promise.all([...$('photos').files].map(f=>imgData(f)));data.records.push({id:Date.now(),cat:$('cat').value,title:$('title').value.trim(),place:$('place').value.trim(),price:Number($('price').value||0),note:$('note').value.trim(),date:today(),photos:ps});$('title').value=$('place').value=$('price').value=$('note').value='';photos.value='';$('preview').innerHTML=''}else if(mode==='spend'){if(!$('spendTitle').value.trim()||!$('amount').value)return alert('請輸入消費與金額');data.spends.push({title:$('spendTitle').value.trim(),amount:Number($('amount').value),cat:$('spendCat').value,date:today()});$('spendTitle').value=$('amount').value=''}else{if(!$('todoText').value.trim())return alert('請輸入待辦');data.todos.push({text:$('todoText').value.trim(),date:$('todoDate').value||today(),done:false});$('todoText').value=''}closeM('addModal');persist()}function openSettings(){$('settings').classList.add('on')}function closeM(x){$(x).classList.remove('on')}$('homeCover').onchange=async()=>{data.homeCover=await imgData($('homeCover').files[0],1800,.8);persist()}$('cardCover').onchange=async()=>{data.covers[cards[active][0]]=await imgData($('cardCover').files[0],1600,.8);persist()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='my-life-backup.json';a.click()}function restore(){let f=$('restoreFile').files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);persist();alert('還原完成 ♡')}catch{alert('備份檔錯誤')}};r.readAsText(f)}function sum(){let u=data.todos.filter(x=>!x.done).length,m=today().slice(0,7),s=data.spends.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.amount,0);$('summary').textContent=`待辦 ${u} 件・本月消費 $${s.toLocaleString()}`}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('date').textContent=new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'short'}).format(new Date());render();sum();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
