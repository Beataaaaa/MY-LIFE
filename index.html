(function(){'use strict';
const el=id=>document.getElementById(id), TYPES=[['MEMORY','生活紀錄・旅行・日常','✈️'],['FAVORITE','收藏・想買・想去','♡'],['BEAUTY','美甲・美容・變美紀錄','✦'],['SPENDING','消費紀錄・理財管理','$'],['DAILY','待辦・行程・習慣','✓'],['HEALTH','健康・飲食・運動','♡']];

function updateMemoryFields(){const cat=el('recordCat').value,isMem=cat==='MEMORY';el('memoryFields').hidden=!isMem;el('generalDateFields').hidden=isMem;el('recordNote').style.display=isMem?'none':'block';if(!isMem&&!el('recordDate').value)el('recordDate').value=date()}el('recordCat').addEventListener('change',updateMemoryFields);function openAdd(m){mode=m;el('addTitle').textContent=m==='record'?'新增生活紀錄':m==='spend'?'新增消費':'新增待辦';el('recordFields').hidden=m!=='record';el('spendFields').hidden=m!=='spend';el('todoFields').hidden=m!=='todo';el('addModal').classList.add('on');if(m==='record')updateMemoryFields()}
el('recordPhotos').onchange=e=>{el('photoPreview').innerHTML='';[...e.target.files].forEach(f=>{const im=new Image();im.src=URL.createObjectURL(f);el('photoPreview').appendChild(im)})};
el('saveBtn').onclick=async()=>{if(mode==='record'){const t=el('recordTitle').value.trim();if(!t)return alert('請輸入標題');const ps=await Promise.all([...el('recordPhotos').files].map(f=>compress(f,1000,.70)));const rc=el('recordCat').value,isMem=rc==='MEMORY';data.records.push({id:Date.now(),cat:rc,title:t,place:el('recordPlace').value.trim(),price:Number(el('recordPrice').value||0),note:isMem?el('memoryStory').value.trim():el('recordNote').value.trim(),mood:isMem?el('memoryMood').value.trim():'',date:isMem?(el('memoryDate').value||date()):(el('recordDate').value||date()),photos:ps});['recordTitle','recordPlace','recordPrice','recordNote','memoryMood','memoryStory','memoryDate','recordDate'].forEach(x=>el(x).value='');el('recordPhotos').value='';el('photoPreview').innerHTML=''}else if(mode==='spend'){const t=el('spendTitle').value.trim(),a=Number(el('spendAmount').value);if(!t||!a)return alert('請輸入消費內容與金額');data.spends.push({id:Date.now(),title:t,amount:a,cat:el('spendCat').value,date:date()});el('spendTitle').value=el('spendAmount').value=''}else{const t=el('todoText').value.trim();if(!t)return alert('請輸入待辦');data.todos.push({text:t,date:el('todoDate').value||date(),done:false});el('todoText').value=''}el('addModal').classList.remove('on');save();const t=el('fab').dataset.type;if(el('fab').classList.contains('on')){if(t==='SPENDING')showSpending();else if(t==='DAILY')showTodos();else showType(t)}};
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openCategory(t){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('on'));const nb=document.querySelector(`[data-nav="${t}"]`);if(nb)nb.classList.add('on');if(t==='SPENDING')showSpending();else if(t==='DAILY')showTodos();else showType(t)}
function showType(t){
  el('memoryAddBtn').hidden=t!=='MEMORY';
  el('fab').classList.add('on');
  el('fab').dataset.type=t;
  el('panel').classList.add('on');
  el('panelTitle').textContent=t==='MEMORY'?'我的回憶':t;
  if(t==='MEMORY'){showMemoryTimeline();return}
  if(t==='BEAUTY'){showBeautyGallery();return}
  const a=data.records.filter(x=>x.cat===t).reverse();
  el('list').innerHTML=a.map(r=>'<div class="item">'+(r.photos&&r.photos[0]?'<img src="'+r.photos[0]+'">':'')+'<b>'+esc(r.title)+'</b><div class="muted">'+esc(r.date)+' '+esc(r.place)+(r.price?'・$'+r.price:'')+'</div><div>'+(r.mood?'♡ '+esc(r.mood)+'<br>':'')+esc(r.note)+'</div><button class="action" data-del-record="'+r.id+'" style="margin-top:8px;padding:7px 10px">刪除</button></div>').join('')||'<p class="muted">還沒有紀錄 ♡</p>';
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})
}

function showBeautyGallery(){
 const a=data.records.filter(x=>x.cat==='BEAUTY').slice().sort((x,y)=>(y.date||'').localeCompare(x.date||''));
 if(!a.length){el('list').innerHTML='<div class="beautyEmpty">還沒有美甲紀錄 ♡<br><span>按右下角 ＋ 新增第一款</span></div>';return}
 el('list').innerHTML='<div class="beautyGrid">'+a.map(r=>{const ph=r.photos&&r.photos[0];return '<article class="beautyCard">'+
 (ph?'<button class="beautyPhotoBtn" data-beauty-photo="'+r.id+'"><img src="'+ph+'" loading="lazy" decoding="async"></button>':'<div class="beautyNoPhoto">♡</div>')+
 '<div class="beautyText"><div class="beautyDate">'+esc(r.date||'')+'</div><h3>'+esc(r.title||'美甲紀錄')+'</h3>'+
 (r.place?'<div class="beautySub">📍 '+esc(r.place)+'</div>':'')+(r.price?'<div class="beautyPrice">$'+Number(r.price).toLocaleString()+'</div>':'')+
 (r.note?'<p>'+esc(r.note)+'</p>':'')+'<button class="beautyDelete" data-del-record="'+r.id+'">刪除</button></div></article>'}).join('')+'</div>';
}
function openPhotoViewer(id){
 const r=data.records.find(x=>String(x.id)===String(id));if(!r||!r.photos||!r.photos.length)return;
 let i=0;const main=el('viewerPhoto'),count=el('viewerCount');
 const paint=()=>{main.src=r.photos[i];count.textContent=(i+1)+' / '+r.photos.length};
 paint();el('photoViewer').classList.add('on');document.body.style.overflow='hidden';
 el('viewerPrev').onclick=()=>{i=(i-1+r.photos.length)%r.photos.length;paint()};
 el('viewerNext').onclick=()=>{i=(i+1)%r.photos.length;paint()};
}
function showMemoryTimeline(){
  const memories=data.records.filter(x=>x.cat==='MEMORY').slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!memories.length){
    el('list').innerHTML='<div class="memoryEmpty">還沒有回憶 ♡<br><br>按上方「＋ 新增回憶 ♡」開始收藏你的日子。</div>';
    return;
  }
  const groups={};
  memories.forEach(r=>{const d=(r.date||date()).split('-'),y=d[0],m=d[1]||'01';(groups[y]??={});(groups[y][m]??=[]).push(r)});
  let html='<div class="memoryTimeline">';
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(y=>{
    html+='<div class="memoryYear">'+y+' 年</div>';
    Object.keys(groups[y]).sort((a,b)=>b.localeCompare(a)).forEach(m=>{
      html+='<div class="memoryMonth"><div class="monthRail">'+Number(m)+'<br><span style="font-size:12px">月</span></div><div>';
      groups[y][m].forEach(r=>{
        const photo=r.photos&&r.photos[0], count=r.photos?r.photos.length:0;
        html+='<article class="memoryPost">'+
          '<div class="memoryHero">'+(photo?'<img src="'+photo+'" alt="" loading="lazy" decoding="async">':'<div class="fallback" style="height:100%">♡</div>')+(count?'<span class="memoryCount">'+count+' 張</span>':'')+'</div>'+
          '<div class="memoryBody"><h3>'+esc(r.title)+' ♡</h3>'+
          '<div class="memoryMeta">📅 '+esc(r.date)+(r.place?'　📍 '+esc(r.place):'')+'</div>'+
          (r.mood?'<div class="memoryMood">☺ '+esc(r.mood)+'</div>':'')+
          '<div class="memoryStory">'+esc(r.note||'')+'</div>'+
          '<button class="memoryOpen" data-memory-open="'+r.id+'">查看這段回憶</button></div></article>';
      });
      html+='</div></div>';
    });
  });
  html+='</div>';
  el('list').innerHTML=html;
}
function openMemoryDetail(id){
  const r=data.records.find(x=>String(x.id)===String(id));if(!r)return;
  const photos=r.photos||[];
  el('detailTitle').textContent=r.title||'我的回憶';
  el('detailInfo').innerHTML='📅 '+esc(r.date||'')+(r.place?'<br>📍 '+esc(r.place):'')+(r.mood?'<br>☺ 心情：'+esc(r.mood):'');
  el('detailStory').textContent=r.note||'';
  const main=el('detailMainPhoto');
  if(photos[0]){main.src=photos[0];main.style.display='block'}else{main.removeAttribute('src');main.style.display='none'}
  el('detailThumbs').innerHTML=photos.map((x,i)=>'<img src="'+x+'" data-detail-photo="'+i+'" class="'+(i===0?'on':'')+'">').join('');
  el('memoryDetail').classList.add('on');
  document.body.style.overflow='hidden';
}
function showSpending(){el('memoryAddBtn').hidden=true;el('fab').classList.add('on');el('fab').dataset.type='SPENDING';el('panel').classList.add('on');el('panelTitle').textContent='消費紀錄';const total=data.spends.reduce((a,x)=>a+Number(x.amount),0);el('list').innerHTML='<h3>累計 $'+total.toLocaleString()+'</h3>'+data.spends.slice().reverse().map(x=>'<div class="item"><b>'+esc(x.title)+'</b>　$'+Number(x.amount).toLocaleString()+'<div class="muted">'+x.date+'・'+x.cat+'</div><button class="action" data-del-spend="'+(x.id||'')+'" style="margin-top:8px;padding:7px 10px">刪除</button></div>').join('')}
function showTodos(){el('memoryAddBtn').hidden=true;el('fab').classList.add('on');el('fab').dataset.type='DAILY';el('panel').classList.add('on');el('panelTitle').textContent='待辦事項';el('list').innerHTML=data.todos.map((x,i)=>'<div class="item"><span data-todo="'+i+'">'+(x.done?'☑':'☐')+' <b style="'+(x.done?'text-decoration:line-through;opacity:.5':'')+'">'+esc(x.text)+'</b></span><div class="muted">'+x.date+'</div><button class="action" data-del-todo="'+i+'" style="margin-top:8px;padding:7px 10px">刪除</button></div>').join('')||'<p class="muted">沒有待辦 ♡</p>'}
el('list').onclick=e=>{const bp=e.target.closest('[data-beauty-photo]');if(bp){openPhotoViewer(bp.dataset.beautyPhoto);return}let mo=e.target.closest('[data-memory-open]');if(mo){openMemoryDetail(mo.dataset.memoryOpen);return}let x=e.target.closest('[data-todo]');if(x){const i=Number(x.dataset.todo);data.todos[i].done=!data.todos[i].done;save();showTodos();return}x=e.target.closest('[data-del-record]');if(x&&confirm('要刪除這筆紀錄嗎？')){data.records=data.records.filter(r=>String(r.id)!==x.dataset.delRecord);save();showType(el('fab').dataset.type);return}x=e.target.closest('[data-del-spend]');if(x&&confirm('要刪除這筆消費嗎？')){const id=x.dataset.delSpend;data.spends=id?data.spends.filter(r=>String(r.id)!==id):data.spends;save();showSpending();return}x=e.target.closest('[data-del-todo]');if(x&&confirm('要刪除這筆待辦嗎？')){data.todos.splice(Number(x.dataset.delTodo),1);save();showTodos()}};
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('on'));b.classList.add('on');const n=b.dataset.nav;if(n==='home'){el('panel').classList.remove('on');el('fab').classList.remove('on');scrollTo({top:0,behavior:'smooth'})}else openCategory(n)});
function summary(){let u=0,total=0,m=date().slice(0,7);for(const x of data.todos){if(!x.done)u++}for(const x of data.spends){if(x.date&&x.date.startsWith(m))total+=Number(x.amount||0)}el('summary').textContent='待辦 '+u+' 件・本月消費 $'+total.toLocaleString()}
el('backupBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='my-life-backup.json';a.click()};
el('restoreBtn').onclick=()=>{const f=el('restoreFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();alert('還原完成 ♡')}catch(e){alert('備份檔格式錯誤')}};r.readAsText(f)};

if(el('memoryBack')&&el('memoryClose'))el('memoryBack').onclick=el('memoryClose').onclick=()=>{el('memoryDetail').classList.remove('on');document.body.style.overflow=''};
if(el('detailThumbs'))el('detailThumbs').onclick=e=>{const im=e.target.closest('[data-detail-photo]');if(!im)return;el('detailMainPhoto').src=im.src;el('detailThumbs').querySelectorAll('img').forEach(x=>x.classList.remove('on'));im.classList.add('on')};
el('viewerClose').onclick=()=>{el('photoViewer').classList.remove('on');document.body.style.overflow=''};
try{render();if('requestIdleCallback'in window){requestIdleCallback(summary,{timeout:500})}else{setTimeout(summary,0)}}catch(err){console.error(err);const st=el('stage');st.innerHTML='';TYPES.forEach((c,i)=>{const card=document.createElement('article');card.className='card '+(i===2?'a':i===1?'l':i===3?'r':'off');card.dataset.index=i;card.innerHTML='<div class="fallback">'+c[2]+'</div><div class="shade"></div><div class="info"><b>'+c[0]+'</b><p>'+c[1]+'</p></div>';st.appendChild(card)})}
})();
</script>
</body></html>
